name: Release

# Macht aus einem gepushten Leitversions-Tag (nc--v<VERSION>, annotiert) das
# GitHub-Release - Notes sind der passende CHANGELOG-Abschnitt. Der Tag wird
# weiterhin bewusst von Hand gesetzt (`claude plugin tag`, Maintainer-Entscheidung;
# die rote Linie "nichts Kundensichtbares automatisieren" bleibt unberührt: das
# Release ist repo-intern). Ablauf dokumentiert in
# knowledge-base/standardprozesse/aktualisierungs-index.md, Abschnitt 3.
on:
  push:
    tags: ["nc--v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions per Full-SHA gepinnt, analog ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Ohne das schlägt die Release-Tag-Invariante in struktur.test.mjs zu:
          # Der Tag-Checkout bringt NUR den gepushten Tag mit, die historischen
          # Tags fehlen. Ihr Skip-Pfad greift hier nicht, weil die Tagliste ja
          # nicht leer ist.
          fetch-tags: true

      # Der Kopfkommentar verspricht annotierte Tags - hier wird es erzwungen
      # statt nur kommentiert: Lightweight-Tags tragen keine Tagger-Info und
      # brechen den dokumentierten Release-Ablauf.
      - name: Tag ist annotiert
        run: |
          typ="$(git cat-file -t "$GITHUB_REF_NAME")"
          echo "Tag-Objekttyp: $typ"
          test "$typ" = "tag"

      # Ein Tag, dessen Stand nicht der Leitversion entspricht, erzeugt ein
      # Release mit falschem Etikett - lieber hart scheitern. Die Leitversion ist
      # die Kern-Version; VERSION, Kern-plugin.json und Registry sind testgesichert
      # gleich, deshalb genügt hier der Vergleich gegen VERSION.
      - name: Tag entspricht der Leitversion
        run: |
          tag_version="${GITHUB_REF_NAME#nc--v}"
          leitversion="$(tr -d '[:space:]' < VERSION)"
          echo "Tag=$tag_version VERSION=$leitversion"
          test "$tag_version" = "$leitversion"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      # Kein Release auf rotem Stand - dieselbe Suite wie in der CI.
      - name: Testsuite (Gate- + Struktur-Invarianten)
        shell: bash
        run: node --test plugins/nc/tests/*.test.mjs

      - name: Release-Notes aus dem CHANGELOG schneiden
        run: |
          version="${GITHUB_REF_NAME#nc--v}"
          # Literalvergleich statt Regex: eine Version mit Metazeichen
          # (z. B. 1.0.0-rc.1+build) darf nie als Muster wirken.
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { drin=1; next }
            drin && /^## \[/ { exit }
            drin { print }
          ' CHANGELOG.md > /tmp/notes.md
          if ! grep -q '[^[:space:]]' /tmp/notes.md; then
            echo "::error::Kein CHANGELOG-Abschnitt [${version}] gefunden - erst den Unreleased-Block schneiden, dann taggen"
            exit 1
          fi
          cat /tmp/notes.md

      - name: GitHub-Release erzeugen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME — NovaCore-OS (Kern)" \
            --notes-file /tmp/notes.md \
            --verify-tag
