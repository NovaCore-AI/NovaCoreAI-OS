# CI — Lint, Typecheck, Tests für jeden PR und push auf main.
# Greenfield-Sicher: der Job skipped sauber, solange keine package.json existiert,
# und reagiert automatisch, sobald der Next.js-Stack gescaffoldet wird.
name: CI

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Typecheck · Test
    # No-op im Greenfield-Stand (kein Code da) — verhindert false-negative Fails.
    if: hashFiles('package.json') != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        # Next.js projiziert tsconfig.json; tsc --noEmit deckt den ganzen App-Router ab.
        run: npx --no-install tsc --noEmit

      - name: Tests
        # --if-present, falls test-Skript noch fehlt; --passWithNoTests vermeidet Fail bei leerer Suite.
        run: npm test --if-present -- --passWithNoTests
