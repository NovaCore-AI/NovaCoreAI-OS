# CodeQL — statistische Sicherheitsanalyse (kostenlos für public repos).
# Greenfield-sicher: läuft erst, sobald JS/TS-Code oder package.json existiert.
# Review M2: Fork-PRs haben nur ein read-only-GITHUB_TOKEN → security-events: write
# wird verweigert. Daher läuft CodeQL nur bei push/schedule und bei PRs aus dem
# eigenen Repo (same-repo). Fork-Contributions werden über push auf main gedeckt.
name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
  schedule:
    # Wöchentlich, Mo früh — Jitter statt :00.
    - cron: '37 4 * * 1'

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: JS/TS analysieren
    # Greenfield-Guard (kein Code → skippen, sonst Fail mit Exit 32) UND
    # M2-Fork-Schutz (Fork-PRs haben kein security-events:write) kombiniert.
    if: |
      (hashFiles('package.json') != '' || hashFiles('**/*.{ts,tsx,js,jsx}') != '') &&
      ((github.event_name == 'push' || github.event_name == 'schedule') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: CodeQL initialisieren
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: CodeQL analysieren
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
